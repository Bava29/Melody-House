<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <!--=========================================
                    Meta Tags
    ==========================================-->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--=========================================
                    Title
    ==========================================-->

    <title>Melody House</title>

    <!--=========================================
                    Favicon
    ==========================================-->

    <link rel="icon" type="image/png" href="images/favicon.png">

    <!--=========================================
                Google Fonts
    ==========================================-->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Sora:wght@100..800&display=swap"
        rel="stylesheet">

    <!--=========================================
                Font Awesome
    ==========================================-->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!--=========================================
                    CSS
    ==========================================-->

    <link rel="stylesheet" href="css/style.css">

</head>

<body>



    <!--=========================================
            Register Page Start
==========================================-->

    <section class="mh-registerpage-section">

        <!-- Top Actions -->

        <div class="mh-registerpage-topactions">

            <button class="icon-btn dark-mode-toggle">

                <i class="fa-solid fa-moon"></i>

            </button>

            <button class="icon-btn rtl-toggle">

                <i class="fa-solid fa-right-left"></i>

            </button>

        </div>

        <div class="container">

            <div class="mh-registerpage-card">

                <!-- Logo -->

                <div class="mh-registerpage-logo">

                    <a href="index.html">

                        <img src="images/logo.png" alt="Melody House">

                    </a>

                </div>

                <!-- Badge -->

                <span class="mh-registerpage-badge">

                    Create Account

                </span>

                <!-- Heading -->

                <h1 class="mh-registerpage-heading">

                    Join Melody House

                </h1>

                <!-- Summary -->

                <p class="mh-registerpage-summary">

                    Create your account to request quotes, manage enquiries and stay connected with Melody House.

                </p>

                <!-- Form -->

                <form class="mh-registerpage-form">

                    <div class="mh-registerpage-row">

                        <input type="text" class="mh-registerpage-input" placeholder="Full Name" required>

                        <input type="email" class="mh-registerpage-input" placeholder="Email Address" required>

                    </div>

                    <div class="mh-registerpage-row">

                        <input type="tel" class="mh-registerpage-input" placeholder="Phone Number" required>

                        <input type="text" class="mh-registerpage-input" placeholder="City">

                    </div>

                    <div class="mh-registerpage-row">

                        <div class="mh-registerpage-passwordbox">

                            <input type="password" id="registerPassword" class="mh-registerpage-input"
                                placeholder="Password" required>

                            <span class="mh-registerpage-eye" id="registerPasswordToggle">

                                <i class="fa-regular fa-eye"></i>

                            </span>

                        </div>

                        <div class="mh-registerpage-passwordbox">

                            <input type="password" id="registerConfirmPassword" class="mh-registerpage-input"
                                placeholder="Confirm Password" required>

                            <span class="mh-registerpage-eye" id="registerConfirmPasswordToggle">

                                <i class="fa-regular fa-eye"></i>

                            </span>

                        </div>

                    </div>

                    <div class="mh-registerpage-options">

                        <label class="mh-registerpage-checkbox">

                            <input type="checkbox" required>

                            <span>

                                I agree to the Terms & Conditions

                            </span>

                        </label>

                    </div>

                    <button type="submit" class="primary-btn">

                        Create Account

                    </button>

                </form>

                <!-- Divider -->

                <div class="mh-registerpage-divider">

                    <span>

                        OR CONTINUE WITH

                    </span>

                </div>

                <!-- Social Login -->

                <div class="mh-registerpage-socials">

                    <a href="#" class="mh-registerpage-google">

                        <img src="images/google-logo.svg" alt="Google">

                    </a>

                    <a href="#" class="mh-registerpage-facebook">

                        <i class="fa-brands fa-facebook-f"></i>

                    </a>

                    <a href="#" class="mh-registerpage-apple">

                        <i class="fa-brands fa-apple"></i>

                    </a>

                </div>

                <!-- Login -->

                <div class="mh-registerpage-footer">

                    <p>

                        Already have an account?

                        <a href="login.html">

                            Login

                        </a>

                    </p>

                </div>

            </div>

        </div>

    </section>

    <!--=========================================
            Register Page End
==========================================-->

    <script src="js/main.js"></script>

</body>

</html>
