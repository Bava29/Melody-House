<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <!--=========================================
                    Meta Tags
    ==========================================-->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--=========================================
                    Title
    ==========================================-->

    <title>Melody House</title>

    <!--=========================================
                    Favicon
    ==========================================-->

    <link rel="icon" type="image/png" href="images/favicon.png">

    <!--=========================================
                Google Fonts
    ==========================================-->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Sora:wght@100..800&display=swap"
        rel="stylesheet">

    <!--=========================================
                Font Awesome
    ==========================================-->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!--=========================================
                    CSS
    ==========================================-->

    <link rel="stylesheet" href="css/style.css">

</head>

<body>


    <!--=========================================
            Login Page Start
==========================================-->

    <section class="mh-loginpage-section">

        <!-- Top Actions -->

        <div class="mh-loginpage-topactions">

            <button class="icon-btn dark-mode-toggle">

                <i class="fa-solid fa-moon"></i>

            </button>

            <button class="icon-btn rtl-toggle">

                <i class="fa-solid fa-right-left"></i>

            </button>

        </div>

        <div class="container">

            <div class="mh-loginpage-card">

                <div class="mh-loginpage-logo">

                    <a href="index.html">

                        <img src="images/logo.png" alt="Melody House">

                    </a>

                </div>

                <span class="mh-loginpage-badge">

                    Welcome Back

                </span>

                <h1 class="mh-loginpage-heading">

                    Sign In to Melody House

                </h1>

                <p class="mh-loginpage-summary">

                    Login to manage your enquiries, quotations and account information.

                </p>

                <form class="mh-loginpage-form">

                    <!-- Email -->

                    <div class="mh-loginpage-field">

                        <input type="email" class="mh-loginpage-input" placeholder="Email Address" required>

                    </div>

                    <!-- Password -->

                    <div class="mh-loginpage-passwordbox">

                        <input type="password" id="loginPassword" class="mh-loginpage-input" placeholder="Password"
                            required>

                        <span class="mh-loginpage-eye" id="loginPasswordToggle">

                            <i class="fa-regular fa-eye"></i>

                        </span>

                    </div>

                    <!-- Remember -->

                    <div class="mh-loginpage-options">

                        <label class="mh-loginpage-checkbox">

                            <input type="checkbox">

                            <span>

                                Remember Me

                            </span>

                        </label>

                        <a href="#" class="mh-loginpage-forgot">

                            Forgot Password?

                        </a>

                    </div>

                    <button type="submit" class="primary-btn">

                        Login

                    </button>

                </form>

                <!-- Divider -->

                <div class="mh-loginpage-divider">

                    <span>

                        OR CONTINUE WITH

                    </span>

                </div>

                <!-- Social Login -->

                <div class="mh-loginpage-socials">

                    <a href="#" class="mh-loginpage-google">

                        <img src="images/google-logo.svg" alt="Google">

                    </a>

                    <a href="#" class="mh-loginpage-facebook">

                        <i class="fa-brands fa-facebook-f"></i>

                    </a>

                    <a href="#" class="mh-loginpage-apple">

                        <i class="fa-brands fa-apple"></i>

                    </a>

                </div>

                <!-- Register -->

                <div class="mh-loginpage-footer">

                    <p>

                        Don't have an account?

                        <a href="register.html">

                            Create Account

                        </a>

                    </p>

                </div>

            </div>

        </div>

    </section>

    <!--=========================================
            Login Page End
==========================================-->

    <script src="js/main.js"></script>

</body>

</html>
